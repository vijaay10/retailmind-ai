# Dev overlay: hot reload, exposed data ports, SMTP catcher.
# Usage: docker compose -f compose.yml -f compose.dev.yml up
services:
  api:
    # `api-reload` runs a single watching process. The plain `api` command
    # runs several workers, and a reload signal to one of them reloads one.
    command: ["api-reload"]
    volumes:
      # /srv/backend/app, not /srv/app: the image copies `backend/` to
      # /srv/backend and imports from there. The old mount landed outside the
      # import path, so hot reload silently did nothing — the container served
      # the code baked into the image and every edit looked like it had no
      # effect.
      - ../../backend/app:/srv/backend/app:ro
    environment:
      RM_APP_LOG_LEVEL: DEBUG

  ui:
    # Streamlit reruns the script on every interaction, so mounting the source
    # is all the reload it needs.
    volumes:
      - ../../ui:/srv/ui:ro
    environment:
      RM_APP_LOG_LEVEL: DEBUG

  worker:
    volumes:
      - ../../backend/app:/srv/backend/app:ro
    environment:
      RM_APP_LOG_LEVEL: DEBUG

  postgres:
    ports: ["5432:5432"]

  redis-cache:
    ports: ["6379:6379"]

  redis-state:
    # Published so a worker running natively in a debugger can reach the
    # broker. Without this the only Redis on the host is the cache, and
    # pointing a broker at an LRU-evicting instance silently drops queued
    # tasks under memory pressure. Offset to 6380 so both are reachable at
    # once and neither collides with a system Redis on the default port.
    ports: ["6380:6379"]

  minio:
    ports: ["9000:9000", "9001:9001"]

  mailpit:
    image: axllent/mailpit:latest
    networks: [app]
    ports: ["8025:8025"]   # web UI for caught emails
    restart: unless-stopped
