# ── Upstreams ─────────────────────────────────────────────────────────
#
# Named rather than inlined so a failure reads as "api unavailable" instead of
# a resolver error, and so keepalive can be pooled.

upstream retailmind_api {
    server api:8000;
    keepalive 32;
}

upstream retailmind_ui {
    server ui:8501;
    keepalive 16;
}

# ── HTTP: redirect, except for the ACME challenge ─────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Certbot writes its challenge here. Redirecting it to HTTPS breaks
    # renewal on a host whose certificate has already expired — which is
    # exactly when renewal matters.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ─────────────────────────────────────────────────────────────

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    # TLS 1.2 and 1.3 only. 1.0 and 1.1 are deprecated and their presence is
    # what a scanner reports first.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;   # let the client pick; modern clients pick better
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;         # tickets without rotation weaken forward secrecy
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── Security headers ──────────────────────────────────────────────
    #
    # Set at the edge because both upstreams would otherwise have to agree,
    # and a header that only one of them sets is a header nobody can rely on.

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    # Streamlit renders inline styles and evaluates its own bundle, so
    # 'unsafe-inline'/'unsafe-eval' are required for scripts and styles. They
    # are scoped to 'self': no third-party origin can execute here, which is
    # the property that actually matters for an internal console.
    #
    # One line, deliberately. nginx has no line-continuation inside a quoted
    # string: a trailing backslash keeps the newline in the value, `nginx -t`
    # still passes, and HTTP/2 then drops the malformed header on the floor.
    # The policy was absent from every response and nothing anywhere said so.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    limit_conn conn 64;

    # ── API ───────────────────────────────────────────────────────────

    location /api/ {
        limit_req zone=api burst=40 nodelay;

        proxy_pass http://retailmind_api;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $req_id;

        # A root-cause investigation sweeps nine dimensions and a report
        # renders three documents; both legitimately take seconds. The default
        # 60s would turn a slow answer into a 504.
        proxy_connect_timeout 5s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_buffering       off;   # stream the response as it is produced
    }

    # Login gets its own bucket. The application locks accounts after five
    # failures; this stops a distributed guess from consuming that budget in
    # under a second.
    location = /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;

        proxy_pass http://retailmind_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $req_id;
    }

    # Health probes bypass the rate limiter and are not logged — an uptime
    # checker polling every ten seconds would otherwise fill the log and,
    # eventually, trip its own limit.
    location = /healthz {
        access_log off;
        proxy_pass http://retailmind_api/health;
        proxy_set_header Host $host;
    }

    location = /readyz {
        access_log off;
        proxy_pass http://retailmind_api/ready;
        proxy_set_header Host $host;
    }

    # Metrics are internal. Exposing them publicly hands an attacker request
    # rates, error counts and endpoint names for free.
    location = /metrics {
        deny all;
        return 404;
    }

    # ── Console ───────────────────────────────────────────────────────

    location / {
        proxy_pass http://retailmind_ui;
        proxy_http_version 1.1;

        # The WebSocket upgrade. Streamlit's entire session runs over it, so
        # without these two headers the page loads and then sits blank.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A Streamlit session holds its socket open for as long as the tab is
        # open. A read timeout shorter than that disconnects idle users and
        # they see "connection error" for having gone to lunch.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }
}
