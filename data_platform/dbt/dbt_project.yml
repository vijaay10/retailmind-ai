# RetailMind AI warehouse — dbt project (DB design §4/§20, ETL design).
name: retailmind
version: "0.0.1"
profile: retailmind

model-paths: ["models"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
target-path: "target"

models:
  retailmind:
    staging:
      +schema: staging
      +materialized: view
    marts:
      core:                    # dim_* / fct_* — gold
        +schema: analytics
        +materialized: table   # incremental per-model where volume demands (ETL §6)
        # Contract enforcement (locked column names/types) lands with the
        # column specs in schema.yml — see docs/database. Enabling it before
        # the specs exist would only fail the build with a less useful message.
        +on_schema_change: fail
      metrics:                 # mart_* — derived, disposable
        +schema: analytics
        +materialized: table
      semantic:                # v_* — the only app-readable layer
        +schema: semantic
        +materialized: view

snapshots:
  retailmind:
    +target_schema: staging    # SCD2 snapshots (DB design §8)

seeds:
  retailmind:
    +schema: staging
    # calendar_454.csv, holiday_calendar.csv, channel_map.csv land in S2

# The forecasting job (ml/) writes into a schema dbt reads but does not own.
# Creating the table here rather than in the training job means the warehouse
# builds on a clone that has never been trained against: without it, the
# fct_forecast source would be missing and every downstream model would fail
# for a reason that has nothing to do with the warehouse.
#
# The DDL is deliberately duplicated from forecasting/warehouse.py rather than
# imported — dbt cannot import Python here, and a create-if-not-exists that
# disagrees with the writer is caught immediately by the insert failing.
on-run-start:
  - "create schema if not exists analytics_ml"
  - "{{ ensure_forecast_predictions() }}"
  - "{{ ensure_forecast_runs() }}"
  - "{{ ensure_forecast_explanations() }}"

# TODO(S2): on-run-end hooks → parse artifacts into META (ETL design §19)
