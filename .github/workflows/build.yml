name: build

# Image build → scan → sign → push (DevOps design §18).
#
# Order matters and is the whole point: an image is built once, scanned, and
# only then pushed. Building separately for the scan and the push produces two
# different images and proves nothing about the one that ships.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "infra/docker/**"
      - "backend/**"
      - "ui/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write        # OIDC for cosign — no static signing key anywhere
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: infra/docker/api.Dockerfile
          - name: ui
            dockerfile: infra/docker/ui.Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Build to the local daemon first. The scan gate runs against this exact
      # image, and only a clean scan proceeds to push.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: local/${{ matrix.name }}:scan
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          build-args: |
            RM_APP_VERSION=${{ github.sha }}

      - name: Scan for known vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: local/${{ matrix.name }}:scan
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          # Unfixed findings cannot be acted on by rebuilding, so gating on
          # them just teaches people to add ignore entries. They are still
          # reported below, where somebody can decide.
          ignore-unfixed: true

      - name: Report every finding, including the unfixable ones
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: local/${{ matrix.name }}:scan
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH,MEDIUM

      - name: Smoke-test the image before it is published
        # A green build proves it compiles. This proves the entrypoint runs and
        # the interpreter can import the application — the two failures a
        # Dockerfile change actually causes.
        run: |
          if [ "${{ matrix.name }}" = "api" ]; then
            docker run --rm --entrypoint python local/${{ matrix.name }}:scan \
              -c "import app.main; print('api imports')"
          else
            docker run --rm --entrypoint python local/${{ matrix.name }}:scan \
              -c "import retailmind_ui.session; print('ui imports')"
          fi

      - name: Generate an SBOM
        uses: anchore/sbom-action@v0
        with:
          image: local/${{ matrix.name }}:scan
          format: spdx-json
          output-file: sbom-${{ matrix.name }}.spdx.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supply-chain-${{ matrix.name }}
          path: |
            trivy-${{ matrix.name }}.sarif
            sbom-${{ matrix.name }}.spdx.json
          retention-days: 30

      # Pull requests stop here: they prove the image builds, scans clean and
      # starts. Publishing from a fork's pull request would let anyone push to
      # the registry.
      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          build-args: |
            RM_APP_VERSION=${{ github.sha }}

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Sign the pushed digest
        if: github.event_name != 'pull_request'
        # Keyless: the signature is bound to this workflow's OIDC identity, so
        # there is no signing key to leak or rotate. Verification checks *who
        # built it*, which is the question that matters.
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}@${{ steps.push.outputs.digest }}

      - name: Attach the SBOM to the image
        if: github.event_name != 'pull_request'
        run: |
          cosign attest --yes --predicate sbom-${{ matrix.name }}.spdx.json --type spdxjson \
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}@${{ steps.push.outputs.digest }}

  compose:
    name: compose files are valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate every overlay combination
        # A production overlay that only fails to parse when somebody deploys
        # it is a production overlay nobody can trust. The prod one needs its
        # required variables present to interpolate, so they are supplied as
        # obvious placeholders.
        env:
          RM_DB_HOST: postgres
          RM_DB_NAME: retailmind_app
          RM_DB_USER: api_rw
          RM_APP_BASE_URL: https://retailmind.example.com
        run: |
          cd infra/compose
          mkdir -p ../secrets && touch ../secrets/{db_password,jwt_private_key,smtp_password,minio_user,minio_password,grafana_password}
          docker compose -f compose.yml config --quiet
          docker compose -f compose.yml -f compose.dev.yml config --quiet
          docker compose -f compose.yml -f compose.prod.yml config --quiet
          echo "all overlays parse"
      - name: Production publishes nothing but the edge
        # Parsing is not the property that matters. This asserts the merged
        # result: the overlay's `ports` removal is one YAML tag wide and the
        # failure mode is silent — the stack comes up and the API is simply
        # open on 8090.
        run: python scripts/check_ports.py

  environment:
    name: environment contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-packages
      # .env.example claims to be checked against the settings model. This is
      # that check: a variable the code reads and the example omits means a
      # deployment silently inherits a development default.
      - run: uv run python scripts/check_env.py
