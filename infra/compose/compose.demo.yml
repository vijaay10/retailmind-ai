# Demo overlay — the path a first-time reader takes.
#
#   make demo
#
# The base stack brings up Postgres, Redis, the API and the console, and then
# stops short of being usable: nothing applies migrations, nothing seeds a
# tenant to log in as, and nothing gives the API a warehouse to read. That is
# three separate reasons a fresh clone showed an empty screen, and this file
# closes all three.
#
# **Migrations run as a service, not as a host command.** `make migrate` needs
# alembic and a database URL on the host; a service needs neither. Everything
# that serves waits on it having *completed*, so the API never queries a schema
# that is half applied.
#
# **The warehouse is built on the host and mounted read-only.** It is the one
# artifact the API image cannot produce — that image installs `backend/` only,
# with no dbt and no ingestion, deliberately, because an API container carrying
# the ETL toolchain is an API container with the ETL's vulnerabilities. A
# directory is mounted rather than the file itself: bind-mounting a path that
# does not exist yet makes Docker create a *directory* there, and the failure
# surfaces later as a DuckDB error about a file that is somehow a folder.

services:
  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    command: ["migrate"]
    environment:
      RM_DB_HOST: ${RM_DB_HOST:-postgres}
      RM_DB_NAME: ${RM_DB_NAME:-retailmind_app}
      RM_DB_USER: ${RM_DB_USER:-api_rw}
      RM_DB_PASSWORD: ${RM_DB_PASSWORD:-dev-only-password}
      # Must match the `api` service below: migration
      # 0008_tenant_warehouse_isolation backfills the demo tenant's
      # `warehouse_path` from whatever this resolves to *at migrate time* —
      # if `migrate` and `api` ever disagree about this path, the demo
      # tenant's warehouse resolution silently points at the wrong file.
      RM_WAREHOUSE_DUCKDB_PATH: /data/warehouse/retailmind.duckdb
    networks: [app]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    # Reference data first — the sample tenant assigns roles that the reference
    # seed creates, so the order is a dependency and not a preference.
    # Both are idempotent, so `make demo` twice is not an error.
    command:
      - sh
      - -c
      - >-
        python -m app.infrastructure.db.seeds.reference &&
        python -m app.infrastructure.db.seeds.sample
    environment:
      # The sample seed refuses to run outside dev. That guard is why this
      # overlay never gets layered onto compose.prod.yml.
      RM_APP_ENV: dev
      RM_DB_HOST: ${RM_DB_HOST:-postgres}
      RM_DB_NAME: ${RM_DB_NAME:-retailmind_app}
      RM_DB_USER: ${RM_DB_USER:-api_rw}
      RM_DB_PASSWORD: ${RM_DB_PASSWORD:-dev-only-password}
    networks: [app]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    environment:
      RM_WAREHOUSE_DUCKDB_PATH: /data/warehouse/retailmind.duckdb
      # One worker, and this is not about load.
      #
      # With no signing key configured the app mints an ephemeral RSA pair at
      # startup — fine for a single process, broken for several. The entrypoint
      # defaults to two workers, so each one signs with a different key and
      # rejects the other's tokens: a user signs in, and roughly every second
      # request afterwards fails with "Access token is not valid". The code
      # already warns about exactly this ("ephemeral keys would differ per
      # replica"), but the guard that enforces a configured key only fires in
      # staging and prod, so dev fails quietly instead of loudly.
      #
      # The demo takes the one-process fix rather than committing a private key
      # to the repository to make two processes agree.
      RM_API_WORKERS: "1"
    volumes:
      # Read-only: the API queries analytics and never writes them. This is
      # also what makes it safe for the console, the worker and the API to hold
      # the same DuckDB file open at once.
      - ../../.local/demo:/data/warehouse:ro
    depends_on:
      seed:
        condition: service_completed_successfully

  worker:
    environment:
      RM_WAREHOUSE_DUCKDB_PATH: /data/warehouse/retailmind.duckdb
      # Scheduled sweeps have no request to infer a tenant from, so an unset
      # value means the worker logs "no tenant configured" and does nothing.
      # The demo leaves it unset on purpose: the tenant id is generated by the
      # seed and is different on every clean run, so there is nothing to put
      # here ahead of time. The alerts on the Command Center come from the
      # seeded tenant, not from a live sweep. Set this to the id printed by
      # the seed to watch sweeps run on a schedule.
      RM_DEFAULT_TENANT_ID: ${RM_DEFAULT_TENANT_ID:-}
    volumes:
      - ../../.local/demo:/data/warehouse:ro
    depends_on:
      seed:
        condition: service_completed_successfully
