[project]
name = "retailmind-etl"
version = "0.0.1"
description = "RetailMind AI data platform — connectors, quality gates, pipeline package"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyarrow>=17.0",
    "duckdb>=1.1",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    # dbt-snowflake — added when the cloud profile lands (S8)
    "great-expectations>=1.1",
    "boto3>=1.35",
    "httpx>=0.27",
    "structlog>=24.4",
    "tenacity>=9.0",
    "typer>=0.12",          # ingestion CLI (backfill, replay, rejects-report)
    "pyyaml>=6.0",          # declared source schemas
    "psycopg[binary]>=3.2", # audit ledger writes (raw SQL, no ORM coupling)
]

[project.optional-dependencies]
airflow = [
    # Airflow is installed in the ETL image / dev environment, not as a lib
    # dependency of the package (its pin set is too invasive). DAGs import
    # this package; this extra exists for local DAG-parse testing only.
    "apache-airflow>=2.10",
]
generators = [
    "numpy>=2.1",
    "pandas>=2.2",          # synthetic retailer generator only — pipeline code is arrow-native
]

[project.scripts]
# Operator entrypoint: `retailmind-etl run --day 2026-07-21`
retailmind-etl = "ingestion.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion", "quality"]
