# RetailMind edge — TLS termination, routing, and the security headers the
# application cannot set for itself.
#
# Everything reaches the platform through here. The API and the console bind
# only to the internal network; publishing 80 and 443 from this container is
# the only way in.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Access logs as JSON, so the edge's lines aggregate alongside the
    # application's structured output instead of needing their own parser.
    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        # Seconds, not milliseconds. `$request_time` is documented in
        # seconds with millisecond resolution, so the fields were named for a
        # unit they never carried: a 9 ms request logged `duration_ms: 0.009`,
        # and anything reading the name would report it a thousand times fast.
        '"duration_s":$request_time,'
        '"upstream":"$upstream_addr",'
        '"upstream_s":"$upstream_response_time",'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"request_id":"$req_id"'
    '}';
    access_log /var/log/nginx/access.log json;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;          # the version number is free reconnaissance

    keepalive_timeout  65;
    client_max_body_size 8m;    # the console uploads nothing; reports download

    # Slow-client protection. Defaults let a client hold a worker open for a
    # minute sending one byte at a time.
    client_body_timeout   12s;
    client_header_timeout 12s;
    send_timeout          20s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    # Rate limits, per zone. The API is what an attacker would hammer; the
    # login endpoint is what they would hammer *hardest*, so it gets its own
    # much tighter bucket on top of the application's own lockout.
    limit_req_zone $binary_remote_addr zone=api:10m   rate=20r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    # A request id passed down so an edge log line and an application log line
    # for the same request can be joined. Mapped to a *new* name: `$request_id`
    # is a built-in nginx variable and redefining it fails config parsing
    # outright — honour an inbound header if the caller sent one, otherwise
    # fall back to the id nginx already generated.
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    # Streamlit runs over a WebSocket. Without this map the Upgrade header is
    # dropped by the proxy and the console loads a blank page that never
    # connects — the single most common way a Streamlit deployment "works" in
    # dev and fails behind a proxy.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
