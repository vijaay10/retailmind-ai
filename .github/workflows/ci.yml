name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-packages
      - run: uv run ruff check backend data_platform ml ui
      - run: uv run ruff format --check backend data_platform ml ui
      # Separate runs: `ui/app.py` and `backend/app/` both map to the
      # module name `app`, which mypy rejects in a single invocation.
      - run: uv run mypy backend/app
      - run: uv run mypy ui

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-packages
      - run: uv run pytest backend/tests/unit data_platform/tests/unit ui/tests -q
      # TODO(S1): integration job (testcontainers), paths-filtered per-package
      # jobs, import-linter contracts, coverage gate ≥85% on domain/services

  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-packages
      - run: cd backend && uv run lint-imports --config ../pyproject.toml
        continue-on-error: true   # TODO(S1): enforce once module skeletons import each other
