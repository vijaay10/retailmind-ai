# Scrape configuration.
#
# Everything here is on the internal network. Prometheus is not published:
# request rates, error counts and endpoint names are reconnaissance, and a
# public /metrics is a free map of the application.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: prod
    service: retailmind

# Alert routing: send evaluated alerts to Alertmanager.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/recording-rules.yml

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels: {component: api}

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
