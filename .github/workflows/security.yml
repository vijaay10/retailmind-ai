name: security

on:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"   # weekly deep scan (DevOps design §19)

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Named for what it is. Both jobs below report success regardless of what
  # they find, so the check list must not imply otherwise — a green "sast" is
  # read as "no findings", and here it means "not yet triaged".
  deps-advisory:
    name: deps (advisory — does not block)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-packages
      # TODO: gate on critical, 7-day SLA on high. Needs a triage budget:
      # a full transitive tree will surface advisories on unrelated changes.
      - run: uv run pip-audit || true

  sast-advisory:
    name: sast (advisory — does not block)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: returntocorp/semgrep-action@v1
        with:
          config: p/python p/security-audit
        continue-on-error: true         # TODO(S1): blocking on critical findings
