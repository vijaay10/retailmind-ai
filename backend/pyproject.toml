[project]
name = "retailmind-backend"
version = "0.0.1"
description = "RetailMind AI backend — FastAPI modular monolith (api, workers)"
requires-python = ">=3.12"
dependencies = [
    # Web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Data & validation
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    # Persistence
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29",
    "alembic>=1.13",
    # Cache / queue
    "redis>=5.0",
    "celery>=5.4",
    # Auth
    "pyjwt[crypto]>=2.9",
    "argon2-cffi>=23.1",
    # Warehouse client (semantic layer)
    "duckdb>=1.1",
    # snowflake-connector-python — added when the cloud profile lands (S8)
    # LLM gateway
    "anthropic>=0.40",
    # Observability
    "structlog>=24.4",
    "opentelemetry-api>=1.27",
    "prometheus-client>=0.21",
    # HTTP / storage adapters
    "httpx>=0.27",
    "boto3>=1.35",
    "tenacity>=9.0",
]

[project.optional-dependencies]
test = [
    "testcontainers>=4.8",
    "schemathesis>=3.36",
    "factory-boy>=3.3",
    "freezegun>=1.5",
    "hypothesis>=6.112",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
