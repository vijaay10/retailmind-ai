# Root workspace: shared tooling config + uv workspace members.
# Each member (backend, data_platform) owns its runtime dependencies.

[project]
name = "retailmind-workspace"
version = "0.0.1"
description = "RetailMind AI monorepo workspace (tooling root — not an installable package)"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["backend", "data_platform", "ml", "ui"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pre-commit>=3.8",
    "import-linter>=2.0",
    "testcontainers>=4.8",
    "types-PyYAML>=6.0",
    "types-openpyxl>=3.1",
    "types-reportlab>=4.2",
    "pandas-stubs>=2.2",
]

# ── Shared tool configuration (single source for the whole monorepo) ──

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "data_platform", "ml", "ui"]

[tool.ruff.lint]
select = [
    "E", "W", "F",      # pycodestyle + pyflakes
    "I",                # isort
    "B",                # bugbear
    "UP",               # pyupgrade
    "S",                # bandit (security)
    "N",                # naming
    "SIM",              # simplify
    "TID",              # tidy imports (no relative parent imports)
]
ignore = ["S101"]       # assert in tests is fine; tests are in scope for S-checks otherwise

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106"]  # dummy credentials in fixtures

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
# strict from day one on domain/services (Backend design §39); relax per-module only via ADR
exclude = ["notebooks"]

# Celery ships neither stubs nor a py.typed marker, so its decorators strip
# annotations from the tasks they wrap. Scoped to the worker package rather
# than relaxed globally.
[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

# Plotly ships no type information. Scoped to the console's chart module
# rather than relaxed globally, so the rest of the UI stays strict.
[[tool.mypy.overrides]]
module = ["plotly.*", "st_aggrid.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.workers.tasks.*", "app.workers.celery_app"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests", "data_platform/tests", "ml/tests", "ui/tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "integration: requires Docker services (testcontainers)",
    "scenario: full-pipeline synthetic-retailer suite (slow, merge-to-main)",
]

# ── Coverage ──────────────────────────────────────────────────────────
#
# Measured across every package the suites exercise, so a service that is only
# covered by integration tests reports honestly rather than looking untested.

[tool.coverage.run]
source = ["backend/app", "data_platform/ingestion", "ml", "ui/retailmind_ui"]
branch = true
parallel = true
omit = [
    "*/migrations/versions/*",  # exercised by the migration round-trip, not unit-callable
    "*/__main__.py",
    "*/conftest.py",
]

[tool.coverage.paths]
# The suites import through different roots (workspace members are installed
# editable); without this, one module reports twice at two paths and the total
# is quietly wrong.
backend = ["backend/app", "*/backend/app"]
etl = ["data_platform/ingestion", "*/data_platform/ingestion"]
ml = ["ml", "*/ml"]
ui = ["ui/retailmind_ui", "*/ui/retailmind_ui"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "if __name__ == .__main__.:",
    # Wiring guards that only fire on a misconfigured container.
    "pragma: no cover",
]

# Architecture boundary contracts (Backend design §2, ETL design §32).
# Wired into CI; contracts tighten as modules land.
[tool.importlinter]
root_packages = ["app"]

[[tool.importlinter.contracts]]
name = "Clean architecture layers: api → services → domain; infrastructure implements ports"
type = "layers"
layers = ["app.api", "app.services", "app.domain"]
