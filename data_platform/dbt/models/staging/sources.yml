version: 2

sources:
  - name: raw
    description: >
      Landing tables written by the ingestion pipeline. Already conformed
      (typed, deduplicated, currency-standardized, business-dated) — the
      warehouse's job starts from trustworthy input, not from raw text.
    schema: raw
    tables:
      - name: pos__sales
        description: POS sales lines, one row per order line per business date.
        loaded_at_field: business_date
        freshness:
          # The nightly SLA is 06:00 tenant-local; a mart built on data older
          # than a day should fail loudly rather than serve stale numbers.
          warn_after: {count: 26, period: hour}
          error_after: {count: 48, period: hour}
        columns:
          - name: order_id
            description: Source order identifier (degenerate dimension).
            data_tests: [not_null]
          - name: line_no
            data_tests: [not_null]
          - name: sku
            data_tests: [not_null]
          - name: store_id
            data_tests: [not_null]
          - name: business_date
            description: Local business date derived in the store's timezone.
            data_tests: [not_null]
          - name: gross_amount
            description: Base-currency amount; source_currency retains the original.
            data_tests: [not_null]

      - name: inventory__positions
        description: >
          Daily inventory positions — one row per SKU × store × day. A state
          feed, not an event feed, which is why the fact it builds is a
          periodic snapshot with semi-additive measures.
        loaded_at_field: business_date
        freshness:
          warn_after: {count: 26, period: hour}
          error_after: {count: 48, period: hour}
        columns:
          - name: sku
            data_tests: [not_null]
          - name: store_id
            data_tests: [not_null]
          - name: on_hand_qty
            data_tests: [not_null]
          - name: business_date
            data_tests: [not_null]

      - name: weather__observations
        description: >
          Daily regional weather from an external provider. The one source
          here the retailer does not produce, and therefore the one dimension
          root-cause analysis can explain a drop with but never act on.
        loaded_at_field: business_date
        columns:
          - name: region
            data_tests: [not_null]
          - name: observation_date
            data_tests: [not_null]

      - name: fulfilment__deliveries
        description: >
          Outbound shipments with promise and delivery dates. Store-fulfilled
          orders never appear: an absent shipment is not a fast one, which is
          why the fact carries the channel alongside the outcome.
        loaded_at_field: business_date
        columns:
          - name: shipment_id
            data_tests: [not_null]
          - name: order_id
            data_tests: [not_null]
          - name: carrier
            data_tests: [not_null]

      - name: purchasing__orders
        description: >
          Purchase order lines — an accumulating snapshot. The same line
          arrives repeatedly as it moves from ordered to received, which is
          what makes lead time, supplier reliability, and inventory aging
          computable.
        loaded_at_field: business_date
        columns:
          - name: po_number
            data_tests: [not_null]
          - name: supplier_id
            data_tests: [not_null]
          - name: sku
            data_tests: [not_null]
          - name: ordered_qty
            data_tests: [not_null]

  - name: ml
    description: >
      Output of the forecasting job (ml/forecasting). Written by Python, read
      by dbt, owned by neither exclusively — which is why the table is created
      by an on-run-start hook rather than by whichever ran first.
    schema: analytics_ml
    tables:
      - name: forecast_predictions
        description: >
          Forward forecasts, one row per target × series × horizon. Replaced
          wholesale per target on each run, so re-running the trainer is
          idempotent rather than additive.
      - name: forecast_runs
        description: >
          One row per trained target per run: the champion, its scorecard, and
          the promotion decision with the reason it was made.
      - name: forecast_explanations
        description: >
          Per-feature contributions behind individual forecasts. Only the
          largest movers are stored — the tail of a linear explanation is
          noise around zero and would triple the table to say nothing.
