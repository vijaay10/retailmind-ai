# Dev overlay: hot reload, exposed data ports, SMTP catcher.
# Usage: docker compose -f compose.yml -f compose.dev.yml up
services:
  api:
    command: ["api"]
    volumes:
      - ../../backend/app:/srv/app:ro   # hot-reload mount
    environment:
      RM_APP_LOG_LEVEL: DEBUG

  postgres:
    ports: ["5432:5432"]

  redis-cache:
    ports: ["6379:6379"]

  minio:
    ports: ["9000:9000", "9001:9001"]

  mailpit:
    image: axllent/mailpit:latest
    networks: [app]
    ports: ["8025:8025"]   # web UI for caught emails
    restart: unless-stopped
