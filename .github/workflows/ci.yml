name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Coverage is combined across jobs, so every job must record paths the same
  # way. Without this the same module reports at two paths and the total is
  # quietly wrong.
  COVERAGE_CORE: sysmon

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-packages
      - run: uv run ruff check backend data_platform ml ui
      - run: uv run ruff format --check backend data_platform ml ui
      # Separate runs: `ui/app.py` and `backend/app/` both map to the
      # module name `app`, which mypy rejects in a single invocation.
      - run: uv run mypy backend/app
      - run: uv run mypy ui

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      # `--extra dagster`, not a bare sync: `test_dagster_orchestration.py`
      # imports dagster unconditionally, and dagster is an optional extra. A
      # bare sync therefore fails *collection* — pytest exits 2 having run no
      # tests at all, so one uninstalled optional dependency took down the
      # whole ladder. Not `--all-extras`: that also drags in Airflow, whose
      # own pyproject comment calls its pin set too invasive, for DAGs this
      # repository does not have.
      - run: uv sync --all-packages --extra dagster
      - name: Run the fast ladder with coverage
        run: |
          uv run pytest backend/tests/unit data_platform/tests/unit ml/tests ui/tests \
            -q --cov --cov-report= --cov-context=test
      - name: Keep the raw coverage for the combine step
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: .coverage*
          include-hidden-files: true
          retention-days: 1

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    # Docker is what makes this job possible at all: testcontainers starts
    # Postgres 16, and the suites build a DuckDB warehouse through the real
    # dbt project. Both are the point — an integration suite that mocks the
    # database proves the mocks agree with themselves.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-packages
      - name: Run integration suites with coverage
        run: |
          uv run pytest backend/tests/integration -m integration \
            -q --cov --cov-report= --cov-context=test
      - name: Keep the raw coverage for the combine step
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: .coverage*
          include-hidden-files: true
          retention-days: 1

  coverage:
    name: coverage gate
    runs-on: ubuntu-latest
    needs: [unit, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-packages
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Combine and report
        run: |
          uv run coverage combine
          uv run coverage report
          uv run coverage html -d htmlcov
          uv run coverage xml
      - name: Gate on the layers that carry the decisions
        # Domain and services are where a wrong number comes from. The API and
        # infrastructure layers are thin and are covered end to end by the
        # integration suites; holding them to the same bar would buy tests of
        # framework glue.
        run: |
          uv run coverage report \
            --include='backend/app/domain/*,backend/app/services/*' \
            --fail-under=85
      - name: Gate the whole tree at a lower bar
        # 80 against an actual 85.3%: enough slack that a legitimate refactor
        # does not fail the build, tight enough that losing a service's tests
        # does. A gate set at today's exact number fails on the next honest
        # change and gets raised by whoever is unblocking themselves.
        run: uv run coverage report --fail-under=80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-html
          path: htmlcov
          retention-days: 14

  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-packages
      # Blocking. The contract reports "1 kept, 0 broken" across 144 files
      # today, so gating costs nothing now and is the only thing that keeps
      # it true tomorrow. It was advisory from the days when the module
      # skeletons did not yet import each other; that reason expired, and an
      # advisory check on the architecture claim this project leads with was
      # a green tick guarding nothing.
      - run: cd backend && uv run lint-imports --config ../pyproject.toml
