[project]
name = "retailmind-ui"
version = "0.0.1"
description = "RetailMind AI — Streamlit operator console"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.40",
    # Charts take dataframes; the API returns records.
    "pandas>=2.2",
    "httpx>=0.27",
    # Enterprise charting: prediction bands, waterfalls, and contribution
    # decompositions are not expressible in Streamlit's built-in charts.
    "plotly>=5.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["retailmind_ui"]
